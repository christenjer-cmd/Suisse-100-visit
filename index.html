<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d52b1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suisse 100">
<title>Suisse 100 — notre liste à deux</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23d52b1e%22/><rect x=%2242%22 y=%2220%22 width=%2216%22 height=%2260%22 fill=%22white%22/><rect x=%2220%22 y=%2242%22 width=%2260%22 height=%2216%22 fill=%22white%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#221d15; --mut:#8a8172; --line:#e9e2d3; --soft:#efe9db;
  --red:#d5301f; --red2:#a52310; --ok:#3a7d44; --ok-bg:#edf4e7; --amber:#a9720d; --amber-bg:#fbf1dc;
  --pink:#c2457c; --pink-bg:#fbe9f1;
  --tint-vil:#b98118; --tint-tra:#c2452e; --tint-som:#5a6acf; --tint-eau:#2a8fbd; --tint-ran:#4c9a52;
  --tint-fet:#a355c0; --tint-gas:#d99a26; --tint-cul:#8a7b64; --tint-ins:#d4568e;
  --shadow:0 1px 2px rgba(64,50,25,.05),0 4px 14px rgba(64,50,25,.06);
  --shadow-2:0 10px 30px rgba(64,50,25,.14);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151310; --card:#201d18; --ink:#f0ebe1; --mut:#9d9482; --line:#332f27; --soft:#2a2720;
    --red:#f05543; --red2:#d5301f; --ok:#8bc98a; --ok-bg:#222f1e; --amber:#e3aa4a; --amber-bg:#2e2617;
    --pink:#ec7fae; --pink-bg:#33202a;
    --tint-vil:#d9a13c; --tint-tra:#e06b52; --tint-som:#8b98e8; --tint-eau:#56b1d8; --tint-ran:#74bd7a;
    --tint-fet:#c07fd8; --tint-gas:#e8b64d; --tint-cul:#ad9f85; --tint-ins:#e57ba8;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --shadow-2:0 12px 34px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Outfit",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + var(--safe-b));
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.serif{font-family:"Fraunces",Georgia,serif}
[hidden]{display:none!important}

/* ---------- barre du haut ---------- */
.appbar{
  position:sticky;top:0;z-index:900;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  padding-top:env(safe-area-inset-top,0px);
}
.appbar::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--red),var(--red2))}
.appbar-in{display:flex;align-items:center;gap:10px;height:54px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:22px;letter-spacing:-.3px}
.brand em{font-style:italic;color:var(--red)}
.cross{width:30px;height:30px;border-radius:9px;flex:none;position:relative;display:inline-block;
  background:linear-gradient(150deg,var(--red),var(--red2));transform:rotate(-4deg);
  box-shadow:0 4px 12px color-mix(in srgb,var(--red) 30%,transparent)}
.cross::before,.cross::after{content:"";position:absolute;background:#fff;border-radius:1.5px}
.cross::before{left:12.5px;top:6px;width:5px;height:18px}
.cross::after{left:6px;top:12.5px;width:18px;height:5px}
.cross.lg{width:54px;height:54px;border-radius:15px}
.cross.lg::before{left:22px;top:11px;width:10px;height:32px}
.cross.lg::after{left:11px;top:22px;width:32px;height:10px}
.pill{margin-left:auto;font-weight:700;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.pill b{color:var(--red)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;font-size:17px;display:grid;place-items:center;flex:none}

/* ---------- barre d'onglets ---------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b));z-index:950;
  width:min(94vw,520px);display:flex;padding:5px;gap:2px;
  background:color-mix(in srgb,var(--card) 90%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-2);
}
.tabbar button{flex:1;border:0;background:transparent;border-radius:17px;padding:6px 2px 5px;
  display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--mut);min-width:0}
.tabbar button span{font-size:19px;line-height:1.15}
.tabbar button.on{background:var(--soft);color:var(--ink)}
.tabbar .dot{position:relative}
.tabbar .dot::after{content:"";position:absolute;top:-1px;right:-6px;width:8px;height:8px;border-radius:50%;background:var(--pink);border:2px solid var(--card)}

/* ---------- vues ---------- */
.view{display:none;padding-top:6px;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.h{font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:800;letter-spacing:-.3px;margin:0}
.sub{color:var(--mut);font-size:13.5px;margin:2px 0 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.boxhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.boxhead .h{flex:1}
.link{border:0;background:none;color:var(--red);font-weight:600;font-size:13px;padding:4px 0;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:30px 10px;font-size:14px}

/* ---------- boutons & champs ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:linear-gradient(150deg,var(--red),var(--red2));border-color:transparent;color:#fff;box-shadow:0 5px 16px color-mix(in srgb,var(--red) 28%,transparent)}
.btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.btn.ghost{box-shadow:none;background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.field{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:13px;background:var(--bg);color:var(--ink);font-size:15px;outline:none}
.field:focus{border-color:var(--red)}
textarea.field{resize:vertical;min-height:62px;font-size:14px}
label.lb{font-size:11px;color:var(--mut);display:block;margin:13px 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}

/* ---------- puces ---------- */
.chips{display:flex;gap:6px;padding:4px 0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrapok{flex-wrap:wrap;overflow:visible}
@media (min-width:700px){.chips{flex-wrap:wrap;overflow:visible}}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 12px;font-size:12.5px;white-space:nowrap;font-weight:600;flex:none}
.chip small{font-size:11px;margin-left:4px;opacity:.75}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.date{position:relative;overflow:hidden}
.chip.date input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

/* ---------- accueil ---------- */
.hero{display:flex;align-items:center;gap:16px;padding:12px 0 0}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .n b{font-family:"Fraunces",Georgia,serif;font-size:30px;font-weight:900;color:var(--red);letter-spacing:-1px}
.ring .n small{font-size:11px;color:var(--mut);font-weight:600;margin-top:3px}
.hero h1{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:900;margin:0;line-height:1.1;letter-spacing:-.4px}
.hero p{margin:6px 0 0;font-size:13.5px;color:var(--mut)}
.hero p b{color:var(--ink)}
.mountains{display:block;width:100%;height:34px;margin-top:10px}

.next{border-color:color-mix(in srgb,var(--amber) 45%,var(--line));background:linear-gradient(160deg,var(--card),var(--amber-bg))}
.next.surprise{border-color:color-mix(in srgb,var(--pink) 45%,var(--line));background:linear-gradient(160deg,var(--card),var(--pink-bg))}
.kicker{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--amber)}
.next.surprise .kicker{color:var(--pink)}
.next .ttl{font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:800;margin:3px 0 2px;letter-spacing:-.2px}
.next .meta{font-size:13px;color:var(--mut)}

.decide .row{margin-top:10px}
.decide .row > span{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:2px}
.fromline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-top:10px}
.fromline button{border:0;background:none;color:var(--ink);font-weight:700;padding:0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.status{font-size:12px;color:var(--mut);min-height:16px;margin:8px 0 0}

.sugg{border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin:10px 0 0;background:var(--bg);position:relative}
.sugg.top{background:var(--card);box-shadow:var(--shadow)}
.sugg .h1{display:flex;gap:11px;align-items:flex-start}
.sugg .emo{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:21px}
.sugg .t{font-weight:700;font-size:16px;line-height:1.25}
.sugg .p{font-size:12.5px;color:var(--mut)}
.sugg .rank{position:absolute;top:-8px;left:12px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.why{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.why span{font-size:11.5px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--soft);color:var(--ink)}
.why span.g{background:var(--ok-bg);color:var(--ok)}
.why span.p{background:var(--pink-bg);color:var(--pink)}
.why span.a{background:var(--amber-bg);color:var(--amber)}
.sugg .btnrow{margin-top:10px}
.minirow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.minirow:last-child{border-bottom:0}
.minirow .e{font-size:19px;width:28px;text-align:center;flex:none}
.minirow .m{flex:1;min-width:0}
.minirow .m b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minirow .m small{display:block;color:var(--mut);font-size:12px}
.minirow .r{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap;text-align:right}

.evrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.evrow:last-child{border-bottom:0}
.cal{width:48px;flex:none;text-align:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.cal i{display:block;font-style:normal;background:var(--red);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:1px 0}
.cal b{display:block;font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:900;line-height:1.35}
.evrow .m{flex:1;min-width:0}
.evrow .m b{display:block;font-size:14.5px;font-weight:700}
.evrow .m small{display:block;font-size:12px;color:var(--mut)}
.evrow .r{font-size:12px;font-weight:700;color:var(--red);white-space:nowrap}

.notice{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));
  border-radius:16px;padding:11px 14px;margin:12px 0 0;font-size:13px;color:var(--mut)}
.notice span{flex:1;min-width:180px}
.notice b{color:var(--ink)}

/* ---------- explorer ---------- */
.toolbar{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:800;padding:8px 0 4px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.searchrow{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;padding:10px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:15px;outline:none}
#q:focus{border-color:var(--red)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;color:var(--mut);font-size:12.5px;padding:7px 10px;border-radius:999px;font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.exphead{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:13px;color:var(--mut)}
.exphead span{flex:1}
.exphead select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600}
.sec{display:flex;align-items:center;gap:10px;margin:24px 0 8px}
.sec .dot{width:10px;height:10px;border-radius:4px;flex:none}
.sec h3{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:800;margin:0;letter-spacing:-.2px}
.sec span{color:var(--mut);font-size:12px;font-weight:600;margin-left:auto;background:var(--soft);border-radius:999px;padding:3px 10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin:9px 0;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;content-visibility:auto;contain-intrinsic-size:auto 110px}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}}
.card.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-bg)}
.card .top{display:flex;gap:12px;align-items:flex-start}
.emo{width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--soft)}
.card .mid{flex:1;min-width:0}
.card .t{font-weight:700;font-size:15.5px;letter-spacing:-.1px;line-height:1.3}
.card.done .t{color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:7px;padding:2.5px 8px;background:var(--soft);color:var(--mut);white-space:nowrap}
.badge.k{background:transparent;border:1px solid var(--line)}
.badge.ga-inc{background:var(--ok-bg);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 55%,transparent)}
.badge.ga-red{color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);background:transparent}
.badge.ga-pay{border:1px solid var(--line);background:transparent}
.badge.tt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.badge.tt.real{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.badge.off{color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);background:transparent}
.badge.ev{background:var(--pink-bg);color:var(--pink)}
.badge.v{background:var(--pink-bg);color:var(--pink)}
.card .d{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.when{font-size:12.5px;color:var(--ok);font-weight:600;margin-top:6px}
.when.plan{color:var(--amber)}
.check{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:17px;line-height:1;color:transparent;transition:all .18s}
.check:hover{border-color:var(--ok)}
.done .check,.check.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* ---------- carte ---------- */
#map{height:calc(100vh - 230px);min-height:380px;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow-2);margin:10px 0;z-index:1}
.maplegend{font-size:12px;color:var(--mut);margin:0 0 8px}
.dotl{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.leaflet-popup-content{font-family:"Outfit",sans-serif;font-size:13.5px;margin:12px 15px;line-height:1.5}
.leaflet-popup-content-wrapper{border-radius:14px}
.pop-open{margin-top:7px;border:1px solid #ddd;background:#f5f2ec;border-radius:999px;padding:5px 12px;font-weight:600;font-size:12.5px;font-family:inherit;color:#221d15}
.homepin{font-size:22px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}

/* ---------- feuilles (dialogues) ---------- */
dialog{border:1px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);padding:0;width:min(560px,94vw);max-height:90vh;box-shadow:var(--shadow-2);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(15,10,5,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
@media (max-width:640px){
  dialog.sheet{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:24px 24px 0 0;max-height:92vh;border-bottom:0}
  dialog.sheet[open]{animation:up .26s cubic-bezier(.2,.8,.3,1)}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shhead{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line);flex:none}
.shhead .emo{width:46px;height:46px;font-size:23px}
.shhead .tt{flex:1;min-width:0}
.shhead h3{margin:0;font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.shhead p{margin:3px 0 0;font-size:12.5px;color:var(--mut)}
.x{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;flex:none;font-size:15px;color:var(--mut)}
.shbody{padding:4px 16px 18px;overflow-y:auto;overscroll-behavior:contain;flex:1;-webkit-overflow-scrolling:touch}
.shfoot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;flex:none;background:var(--card)}
.shbody .d{font-size:14px;color:var(--mut);margin:12px 0 0;line-height:1.55}
.part{margin-top:18px}
.part > h4{font-size:11px;color:var(--mut);margin:0 0 7px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;display:flex;gap:8px;align-items:center}
.part > h4 small{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.minimap{height:170px;border-radius:14px;border:1px solid var(--line);margin-top:12px;position:relative;z-index:1;cursor:pointer}
.votes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.votes button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.votes button.on{border-color:var(--pink);background:var(--pink-bg);color:var(--pink)}
.votes button.on.no{border-color:var(--mut);background:var(--soft);color:var(--ink)}
.votes .other{font-size:12.5px;color:var(--mut);flex-basis:100%}
.photos{display:flex;flex-wrap:wrap;gap:7px}
.photos img{width:78px;height:78px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.photos .none{font-size:12.5px;color:var(--mut);padding:4px 0}
.nearrow{display:flex;flex-wrap:wrap;gap:6px}
.near{font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-weight:600}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* sur place */
.sprow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.sprow:last-child{border-bottom:0}
.spemo{width:24px;text-align:center;font-size:16px;flex:none}
.spt{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.spt small{display:block;color:var(--mut);font-size:11.5px;font-weight:500}
.spd{font-size:12px;color:var(--red);font-weight:700;white-space:nowrap}
.spgrp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:12px 0 2px;display:flex;align-items:center;gap:6px}
.spgrp small{margin-left:auto;background:var(--soft);border-radius:999px;padding:1px 8px;font-size:10.5px;letter-spacing:0}
.spmsg{font-size:12.5px;color:var(--mut);padding:8px 2px;margin:0}
.spmsg button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;margin-left:4px}

/* plan de journée */
.wxbig{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.wxbig .e{font-size:34px;line-height:1}
.wxbig b{font-size:17px}
.wxbig small{display:block;color:var(--mut);font-size:12.5px}
.conn{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.conn:last-child{border-bottom:0}
.conn .tm{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.conn .dt{flex:1;min-width:0;color:var(--mut);font-size:12px}
.conn .du{font-weight:700;color:var(--ok);font-size:12.5px;white-space:nowrap}
.conn.last{background:var(--amber-bg);border-radius:10px;padding:9px 8px;border:0;margin-top:6px}
.pack label{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
.pack label:last-child{border-bottom:0}
.pack input{width:19px;height:19px;accent-color:var(--ok);flex:none}
.pack input:checked + span{text-decoration:line-through;color:var(--mut)}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer}
.toggle input{width:19px;height:19px;accent-color:var(--pink)}
.evnote{background:var(--pink-bg);color:var(--pink);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;margin-top:10px}

/* ---------- à deux ---------- */
.deck{position:relative;height:440px;margin:14px 0 8px}
.dcard .d{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.dcard{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-2);padding:22px 20px;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;transition:transform .28s cubic-bezier(.2,.8,.3,1),opacity .28s}
.dcard.drag{transition:none}
.dcard.back{transform:scale(.95) translateY(10px);opacity:.6;pointer-events:none}
.dcard .big{font-size:46px;line-height:1}
.dcard h3{font-family:"Fraunces",Georgia,serif;font-size:25px;font-weight:900;margin:10px 0 4px;letter-spacing:-.3px;line-height:1.15}
.dcard .p{color:var(--mut);font-size:13px}
.dcard .d{font-size:14.5px;margin-top:12px;line-height:1.55;flex:1;overflow:hidden}
.dcard .stamp{position:absolute;top:22px;right:20px;font-weight:900;font-size:20px;border:3px solid;border-radius:10px;padding:2px 10px;opacity:0;transform:rotate(12deg)}
.dcard .stamp.yes{color:var(--pink)}
.dcard .stamp.no{color:var(--mut);left:20px;right:auto;transform:rotate(-12deg)}
.dcard .hint{background:var(--pink-bg);color:var(--pink);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;align-self:flex-start;margin-top:8px}
.deckbtns{display:flex;justify-content:center;gap:16px;align-items:center}
.deckbtns button{border:1px solid var(--line);background:var(--card);border-radius:50%;box-shadow:var(--shadow);display:grid;place-items:center}
.deckbtns .no{width:58px;height:58px;font-size:22px}
.deckbtns .yes{width:70px;height:70px;font-size:30px;border-color:color-mix(in srgb,var(--pink) 50%,var(--line))}
.deckbtns .star{width:58px;height:58px;font-size:24px}
.deckbtns .undo{width:44px;height:44px;font-size:16px}
.deckcount{text-align:center;font-size:12.5px;color:var(--mut);margin-top:10px}
.who{display:flex;gap:8px;margin-top:6px}
.who label{flex:1;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer}
.who input{accent-color:var(--red)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;max-height:90px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--mut)}

/* ---------- souvenirs ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:"Fraunces",Georgia,serif;font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--red);line-height:1.1}
.stat b small{font-size:16px;color:var(--mut);letter-spacing:0}
.stat span{font-size:12px;color:var(--mut);font-weight:600}
.cantons{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px;margin:10px 0}
.canton{border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center;background:var(--card)}
.canton b{display:block;font-size:14px}
.canton small{font-size:11px;color:var(--mut);font-weight:600}
.canton.some{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-bg)}
.canton.some b{color:var(--ok)}
.brow{display:flex;align-items:center;gap:10px;margin:7px 0}
.brow .bl{width:165px;flex:none;font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.brow .bl{width:120px}}
.brow .bt{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.brow .bt i{display:block;height:100%;border-radius:99px}
.brow .bn{width:46px;flex:none;font-size:12px;color:var(--mut);font-weight:600;text-align:right}
.months{display:flex;align-items:flex-end;gap:5px;height:84px;margin:12px 0 2px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.mcol i{display:block;width:100%;max-width:26px;background:var(--red);border-radius:4px 4px 2px 2px;min-height:3px}
.mcol.zero i{background:var(--soft)}
.mcol small{font-size:9.5px;color:var(--mut);font-weight:600}
.mcol b{font-size:10.5px}
.jentry{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow);cursor:pointer}
.jdate{font-size:11.5px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center}
.jdate::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px}
.jentry.up{border-style:dashed}
.jentry.up .jdate{color:var(--amber)}
.jentry.up .jdate::before{background:var(--amber)}
.jt{font-weight:700;font-size:16px;margin-top:4px}
.jp{font-size:13px;color:var(--mut)}
.jnote{font-size:13.5px;margin-top:9px;padding:9px 12px;background:var(--bg);border-radius:12px;white-space:pre-wrap}
.jentry .photos{margin-top:10px}
.printcover{display:none}

/* ---------- photos ---------- */
.thumb{width:66px;height:66px;border-radius:15px;flex:none;position:relative;overflow:hidden;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .mini{position:absolute;right:3px;bottom:3px;font-size:11px;line-height:1;background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:7px;padding:3px}
.card.done .thumb img{filter:saturate(.75)}
.hero-img{position:relative;height:230px;flex:none;background:var(--soft);overflow:hidden}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.7) 100%)}
.hero-img .ov{position:absolute;left:16px;right:16px;bottom:13px;z-index:1;color:#fff}
.hero-img h3{margin:0;font-family:"Fraunces",Georgia,serif;font-size:25px;font-weight:900;line-height:1.12;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.hero-img p{margin:4px 0 0;font-size:13px;opacity:.92}
.hero-img .x{position:absolute;top:12px;right:12px;z-index:2;background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.credit{font-size:11px;color:var(--mut);margin-top:6px}
.credit a{color:var(--mut)}
.sugg .banner{height:150px;margin:-13px -14px 12px;border-radius:17px 17px 0 0;overflow:hidden;position:relative;background:var(--soft)}
.sugg .banner img{width:100%;height:100%;object-fit:cover;display:block}
.sugg .rank{z-index:2}
.minirow .tmb{width:42px;height:42px;border-radius:12px;flex:none;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:19px;position:relative}
.minirow .tmb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb:not(:has(img)) .mini{inset:0;display:grid;place-items:center;font-size:24px;background:none;border-radius:0}
.popimg{width:210px;height:118px;object-fit:cover;border-radius:10px;display:block;margin:0 0 7px}

/* carrousel d'inspiration */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.insp{flex:none;width:212px;height:272px;border-radius:22px;position:relative;overflow:hidden;scroll-snap-align:start;background:var(--soft);box-shadow:var(--shadow-2);cursor:pointer;color:#fff}
.insp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
@media(hover:hover){.insp:hover img{transform:scale(1.05)}}
.insp::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.72) 100%)}
.insp .ov{position:absolute;left:14px;right:14px;bottom:13px;z-index:1}
.insp b{display:block;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:800;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.insp small{display:block;font-size:12px;opacity:.92;margin-top:4px}
.insp .tag{position:absolute;top:11px;left:11px;z-index:2;font-size:11px;font-weight:700;background:rgba(255,253,248,.92);color:#221d15;border-radius:999px;padding:3px 9px}
.insp .heart{position:absolute;top:8px;right:8px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .15s}
.insp .heart.on{background:var(--pink)}
.insp .heart:active{transform:scale(.88)}
.insp.noimg{background:linear-gradient(160deg,var(--red),var(--red2))}
.insp.noimg .big{position:absolute;top:70px;left:0;right:0;text-align:center;font-size:64px}

/* cartes à glisser avec photo */
.dcard .dimg{height:178px;margin:-22px -20px 14px;border-radius:25px 25px 0 0;overflow:hidden;flex:none;background:var(--soft);position:relative}
.dcard .dimg img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.dcard .dimg .big{position:absolute;inset:0;display:grid;place-items:center;font-size:60px}
.dcard.withimg h3{margin-top:0}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.bdg{border:1px solid var(--line);border-radius:16px;padding:11px 8px 10px;text-align:center;background:var(--card)}
.bdg i{font-style:normal;font-size:27px;display:block;line-height:1.2}
.bdg b{display:block;font-size:12px;line-height:1.25;margin-top:4px}
.bdg small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.3}
.bdg.lock i{filter:grayscale(1);opacity:.45}
.bdg.got{border-color:color-mix(in srgb,var(--amber) 55%,var(--line));background:linear-gradient(160deg,var(--card),var(--amber-bg))}
.bdg .pg{height:4px;background:var(--soft);border-radius:9px;margin-top:7px;overflow:hidden}
.bdg .pg span{display:block;height:100%;background:var(--red);border-radius:9px}
.confetti{position:fixed;z-index:4000;pointer-events:none;font-size:22px;left:0;top:0;will-change:transform,opacity}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);z-index:3000;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 14px 11px 16px;font-size:14px;font-weight:500;
  display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:all .25s;max-width:min(92vw,480px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}

/* ---------- visionneuse ---------- */
#lb{background:rgba(12,9,5,.96);border:0;width:100vw;max-width:100vw;height:100vh;max-height:100vh;border-radius:0;align-items:center;justify-content:center}
#lb img{max-width:94vw;max-height:76vh;border-radius:12px}
#lb .lbrow{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;justify-content:center}
#lb button{border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.09);color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600}
#lb .lbdel{border-color:#ff8d84;color:#ff8d84}

/* ---------- impression : carnet souvenir ---------- */
@media print{
  .appbar,.tabbar,#toast,.view:not(#v-souv),.noprint,.jentry.up,.upsub,dialog{display:none!important}
  body{background:#fff;color:#111;padding:0}
  .view#v-souv{display:block!important}
  .printcover{display:block;text-align:center;padding:30vh 0 8vh;page-break-after:always}
  .printcover h2{font-family:"Fraunces",Georgia,serif;font-size:42px;font-weight:900;margin:14px 0 0}
  .printcover h2 em{font-style:italic;color:var(--red)}
  .printcover p{color:#666;font-size:15px}
  .jentry{break-inside:avoid;box-shadow:none;border:1px solid #ddd;background:#fff}
  .jnote{background:#f6f3ec}
  .photos img{width:118px;height:118px}
}
</style>
</head>
<body>

<header class="appbar">
  <div class="wrap appbar-in">
    <button class="brand" data-go="home" aria-label="Accueil"><span class="cross"></span><span>Suisse <em>100</em></span></button>
    <span class="pill" id="pill"><b>0</b> / 100</span>
    <button class="iconbtn" id="btnSettings" aria-label="Réglages">⚙️</button>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="v-home" aria-label="Accueil"></section>

  <section class="view" id="v-explore" aria-label="Explorer">
    <div class="toolbar">
      <div class="searchrow">
        <input id="q" type="search" placeholder="« lac montagne », « fondue », « Tessin »…" aria-label="Rechercher">
        <div class="seg" id="segStatus">
          <button data-s="all" class="on">Tout</button>
          <button data-s="todo">À faire</button>
          <button data-s="plan">Prévus</button>
          <button data-s="done">Faits</button>
        </div>
      </div>
      <div class="chips" id="catChips"></div>
      <div class="chips" id="moreChips"></div>
    </div>
    <div class="exphead">
      <span id="expCount"></span>
      <select id="sortSel" aria-label="Trier">
        <option value="cat">Par catégorie</option>
        <option value="dist">Plus proches d’abord</option>
        <option value="rand">Au hasard</option>
      </select>
      <button class="btn sm" data-act="random" aria-label="Une idée au hasard">🎲</button>
      <button class="btn sm" id="btnAdd">＋ Idée</button>
    </div>
    <div id="list"></div>
  </section>

  <section class="view" id="v-map" aria-label="Carte">
    <div id="map"></div>
    <p class="maplegend">Les filtres d’Explorer s’appliquent ·<span class="dotl" style="background:#d52b1e"></span>à faire<span class="dotl" style="background:#d99a26"></span>prévu<span class="dotl" style="background:#c2457c"></span>envie commune<span class="dotl" style="background:#2f7d38"></span>fait</p>
  </section>

  <section class="view" id="v-couple" aria-label="À deux"></section>
  <section class="view" id="v-souv" aria-label="Souvenirs"></section>
</main>

<nav class="tabbar" id="tabbar" aria-label="Navigation">
  <button data-v="home" class="on"><span>🏠</span>Accueil</button>
  <button data-v="explore"><span>🧭</span>Explorer</button>
  <button data-v="map"><span>🗺️</span>Carte</button>
  <button data-v="couple"><span id="coupleIcon">💞</span>À deux</button>
  <button data-v="souv"><span>📖</span>Souvenirs</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlgItem" class="sheet" aria-label="Fiche"></dialog>
<dialog id="dlgDay" class="sheet" aria-label="Préparer la sortie"></dialog>
<dialog id="dlgSettings" class="sheet" aria-label="Réglages"></dialog>
<dialog id="dlgAdd" class="sheet" aria-label="Ajouter une idée">
  <form method="dialog" id="formAdd" style="display:contents">
    <div class="shhead"><div class="tt"><h3>Ajouter une idée</h3><p>Elle rejoindra votre liste et la carte.</p></div><button type="button" class="x" data-close aria-label="Fermer">✕</button></div>
    <div class="shbody">
      <label class="lb" for="fT">Titre *</label><input class="field" id="fT" required maxlength="80" placeholder="p. ex. Marché de Noël de Montreux">
      <label class="lb" for="fP">Lieu</label><input class="field" id="fP" maxlength="60" placeholder="p. ex. Montreux">
      <div class="btnrow" style="margin-top:8px"><button type="button" class="btn sm" id="fGeo">📍 Je suis sur place</button><span class="sub" id="fGeoTxt">Sinon, on localise le lieu automatiquement.</span></div>
      <div class="twocol">
        <div><label class="lb" for="fC">Catégorie</label><select class="field" id="fC"></select></div>
        <div><label class="lb" for="fR">Région</label><select class="field" id="fR"></select></div>
      </div>
      <label class="lb" for="fK">Canton (sigle)</label><input class="field" id="fK" maxlength="2" placeholder="VD" style="text-transform:uppercase">
      <label class="lb" for="fD">Description</label><textarea class="field" id="fD" maxlength="220" rows="2"></textarea>
    </div>
    <div class="shfoot"><button type="button" class="btn ghost" data-close>Annuler</button><button type="submit" class="btn primary" style="margin-left:auto">Ajouter</button></div>
  </form>
</dialog>
<dialog id="lb" aria-label="Photo">
  <img id="lbimg" alt="">
  <div class="lbrow">
    <button id="lbprev">‹ Précédente</button>
    <button id="lbnext">Suivante ›</button>
    <button class="lbdel" id="lbdel">🗑 Supprimer</button>
    <button id="lbclose">✕ Fermer</button>
  </div>
</dialog>
<input type="file" id="fileImport" accept=".json,application/json" hidden>
<input type="file" id="filePhoto" accept="image/*" multiple hidden>

<script src="data.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
</body>
</html>
